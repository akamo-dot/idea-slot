<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080f">
<link rel="manifest" href="./manifest.json">
<title>IDEA SLOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08080f;--surface:#12121f;--border:#1e1e30;--cyan:#00e5ff;--pink:#ff6b9d;--gold:#ffd93d;--purple:#7c4dff;--green:#4ade80;--text:#e2e2ea}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);max-width:480px;margin:auto;min-height:100dvh}
button,textarea,input{font:inherit}button{cursor:pointer}
.screen{display:none;min-height:100dvh;flex-direction:column}.screen.active{display:flex}
.header{text-align:center;padding-top:14px}.header h1{font-size:14px;letter-spacing:6px;color:#444;margin:0}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 10px}.slot{min-width:0;text-align:center}.label{font-size:10px;font-weight:800;letter-spacing:2px;opacity:.7;margin-bottom:6px}
.box{height:90px;border:2px solid;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;position:relative;cursor:pointer;transition:.25s}.box.shuttered:after{content:"";position:absolute;z-index:5;inset:-3px;background:#202027;transform:translateY(0);animation:shutter .18s ease-out;border-radius:12px}.box.shuttered:before{content:"";position:absolute;z-index:6;left:-3px;right:-3px;top:50%;height:2px;background:#2b2b33;box-shadow:0 -22px 0 #2b2b33,0 22px 0 #2b2b33}@keyframes shutter{from{transform:translateY(-105%)}to{transform:translateY(0)}}to{transform:translateY(0)}}
.val{font-size:24px;font-weight:900;line-height:1.15}.hold{margin-top:8px;width:100%;min-height:38px;padding:9px 6px;border-radius:9px;border:1px solid #2d2d3d;background:#11111b;color:#666;font-size:12px;font-weight:900;letter-spacing:2px;transition:.2s}
.meaning{min-height:34px;text-align:center;color:#00e5ff80;font-size:12px}.meaning span{display:inline-block;background:#00e5ff08;padding:8px 12px;border-radius:8px}
.spacer{flex:1}.control-fixed{flex:none}.plotbtn{flex:none;margin-top:14px}
.plotbtn{width:100%;padding:12px;border-radius:11px;border:1px solid #7c4dff55;background:#7c4dff12;color:#a98cff;font-size:16px;font-weight:900;letter-spacing:3px;margin-top:14px;margin-bottom:10px}
.ai{display:none;background:var(--surface);border:1px solid #7c4dff44;border-radius:12px;padding:14px;margin-bottom:12px}.ai.show{display:block}
.aihead{font-size:10px;color:#8d70ff;font-weight:900;letter-spacing:2px;margin-bottom:8px}.aitext{font-size:13px;color:#aaa;line-height:1.75;white-space:pre-wrap}
.aiactions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.mini{padding:6px 10px;border:1px solid #2a2a3c;border-radius:7px;background:transparent;color:#777;font-size:10px;font-weight:800}.mini.on{color:var(--green);border-color:#4ade8055}
.start{width:100%;padding:21px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-size:22px;font-weight:900;letter-spacing:8px}
.row{display:flex;gap:10px;margin-top:10px}.sub{flex:1;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:#444;font-weight:800;letter-spacing:3px;position:relative}
.badge{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#000;font-size:11px}
.reset{text-align:center;margin-top:12px}.reset button{border:0;background:transparent;color:#333;font-size:10px;letter-spacing:3px}
.custom.show{display:block}
.back{border:0;background:transparent;color:#666;text-align:left;padding:16px 0}.combo{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.tag{padding:6px 12px;border-radius:8px;font-weight:800}
.memobox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}.memobox label{display:block;font-size:10px;color:#555;font-weight:900;letter-spacing:1px;margin-bottom:8px}
.memobox textarea{width:100%;border:0;outline:0;resize:vertical;background:transparent;color:#ccc;font-size:14px;line-height:1.7}
.complete{width:100%;padding:16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-weight:900;letter-spacing:2px}
.noteshead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 22px}.noteshead h2{margin:0}.stock{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:.2s;cursor:pointer}
.stock.used{border-color:#4ade8035;background:#101913}
.stock.used .stock-collapsed{opacity:.62}
.stock-collapsed{display:flex;align-items:center;gap:6px;min-height:34px}
.stock-collapsed .pwe{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.stock-collapsed .pwe-item{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-collapsed .sep{color:#333;font-size:11px}
.stock-date{font-size:9px;color:#3f3f49;white-space:nowrap;margin-left:6px}
.stock-used-mark{font-size:9px;font-weight:900;color:var(--green);letter-spacing:.5px;white-space:nowrap}
.stock-expanded{display:none;padding-top:10px;border-top:1px solid #1b1b28;margin-top:8px}
.stock.open .stock-expanded{display:block}
.stock.open .stock-collapsed{margin-bottom:2px}
.stock.open{border-color:#2a2a3b}
.stocktags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.stockmemo,.stockai{padding-left:24px;margin-top:9px;color:#999;font-size:13px;line-height:1.6}.stockai{color:#817b95}.stocklabel{font-size:9px;color:#555;font-weight:900;letter-spacing:1px}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding-left:24px;margin-top:11px}.actions button{padding:6px 9px;border:1px solid #29293b;border-radius:7px;background:transparent;color:#666;font-size:10px;font-weight:800}.actions .load{color:#8f72ff;border-color:#7c4dff66}.actions .usedon{color:var(--green);border-color:#4ade8055}
.clear{width:100%;padding:10px;border:1px solid #421a1a;border-radius:8px;background:transparent;color:#ef4444;margin:12px 0 25px}

.idea-tools{display:flex;gap:8px;margin-top:12px}
.idea-tool{flex:1;padding:11px 5px;border-radius:10px;border:1px solid #242437;background:#10101b;color:#777;font-size:11px;font-weight:900;letter-spacing:1.2px}
.idea-tool:disabled{opacity:.25}.idea-assist{display:none;margin-top:10px;padding:12px 14px;border:1px solid #252538;border-radius:11px;background:#0e0e18;line-height:1.55}
.idea-assist.show{display:block}.idea-assist-label{font-size:9px;font-weight:900;letter-spacing:2px;color:#555;margin-bottom:5px}.idea-assist-main{font-size:17px;font-weight:850;color:#eee}.idea-assist-sub{font-size:11px;color:#666;margin-top:4px}
.stock-state{font-size:9px;font-weight:900;letter-spacing:.5px;white-space:nowrap}.stock-state.seed{color:#777}.stock-state.grow{color:#ffd93d}.stock-state.used{color:#4ade80}
.filterbar{display:flex;gap:6px;margin-bottom:14px}.filterbar button{flex:1;padding:8px 3px;border:1px solid #222233;border-radius:8px;color:#555;font-size:9px;font-weight:900}.filterbar button.active{border-color:#555;color:#bbb;background:#151520}

.hold.is-held{background:rgba(255,255,255,.04);box-shadow:0 0 12px rgba(255,255,255,.04)}
.note-bottom-actions{display:flex;gap:10px;margin:12px 0 25px}
.note-bottom-actions .clear{flex:1;margin:0}
.copy-all{flex:1;padding:10px;border:1px solid #2f2f48;border-radius:8px;background:transparent;color:#8f72ff;font-size:13px;font-weight:800;letter-spacing:1px}
.copy-all.copied{color:#4ade80;border-color:#4ade8055}


.slot-box .val{font-weight:900!important}

/* v20: 4 reels in a 2x2 grid for better mobile readability */
.slots{
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:14px 10px!important;
  margin:24px 0 10px!important;
}
.slot{
  min-width:0!important;
  width:100%!important;
}
.box{
  width:100%!important;
}
.box .val{
  font-weight:900!important;
  font-size:24px;
  overflow-wrap:anywhere;
}


.slot-memo-btn{
  margin-top:6px;
  width:100%;
  min-height:30px;
  padding:6px 4px;
  border:1px solid #242436;
  border-radius:7px;
  background:#0e0e18;
  color:#575766;
  font-size:9px;
  font-weight:900;
  letter-spacing:1.5px;
}
.slot-memo-btn.has-memo{
  color:#c8c8d4;
  border-color:#45455b;
}
.slot-memo-btn:disabled{
  opacity:.22;
  cursor:default;
}
.slot-memo-panel{
  display:none;
  margin:0 0 12px;
  padding:12px;
  border:1px solid #252538;
  border-radius:10px;
  background:#0d0d18;
}
.slot-memo-panel.show{display:block}
.slot-memo-title{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  color:#777;
  margin-bottom:8px;
}
.slot-memo-panel textarea{
  width:100%;
  resize:vertical;
  border:1px solid #242436;
  border-radius:8px;
  outline:none;
  padding:10px;
  background:#11111c;
  color:#ddd;
  font-size:13px;
  line-height:1.6;
}
.slot-memo-actions{display:flex;gap:8px;margin-top:8px}
.slot-memo-actions button{
  flex:1;
  padding:9px 6px;
  border:1px solid #2b2b3d;
  border-radius:8px;
  background:#141420;
  color:#888;
  font-size:10px;
  font-weight:900;
}
.meaning{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
}


.slot-original-input{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  border:1px solid #2b2b3d;
  border-radius:8px;
  outline:none;
  background:#11111c;
  color:#ddd;
  font-size:13px;
}
.slot-original-input::placeholder{color:#555}
.slot-memo-actions{display:grid;grid-template-columns:1.25fr 1fr .8fr;gap:7px;margin-top:8px}
.slot-memo-actions .slot-add-original{
  color:#00e5ff;
  border-color:#00e5ff40;
  background:#00e5ff0b;
}


.slots .slot{display:flex;flex-direction:column}
.slots .slot .hold{margin-top:8px}
.slots .slot .slot-memo-btn{margin-top:6px}




.top-version{
  display:block;
  width:100%;
  margin:4px 0 0;
  text-align:center;
  font-size:9px;
  font-weight:700;
  line-height:1;
  letter-spacing:.18em;
  color:#66666f;
  opacity:1;
}


/* v29: reel tap = HOLD / button = BLIND */
.box{cursor:pointer}
.hold{letter-spacing:1.5px}

/* v30: keep START position fixed even when WORD meaning is hidden */
.meaning{
  height:42px!important;
  min-height:42px!important;
  max-height:42px!important;
  margin-bottom:12px!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  overflow:hidden!important;
  flex:none!important;
}
.meaning span{
  display:block;
  width:100%;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

</style>
</head>
<body>

<section id="slotScreen" class="screen active">
<div class="header"><h1>IDEA SLOT</h1>
<div class="top-version">VER v30</div></div>
<div class="slots">
  <div class="slot">
    <div class="label" id="lab2" style="color:var(--gold)">PERSON</div>
    <div class="box" id="box2" onclick="toggleHold(2)" style="border-color:#ffd93d40"><div class="val" id="v2">—</div></div>
    <button class="hold" id="h2" onclick="toggleShutter(2)">BLIND</button><button class="slot-memo-btn" id="sm2" onclick="openSlotMemo(2)">MEMO</button>
  </div>
  <div class="slot">
    <div class="label" id="lab0" style="color:var(--cyan)">WORD</div>
    <div class="box" id="box0" onclick="toggleHold(0)" style="border-color:#00e5ff40"><div class="val" id="v0">—</div></div>
    <button class="hold" id="h0" onclick="toggleShutter(0)">BLIND</button><button class="slot-memo-btn" id="sm0" onclick="openSlotMemo(0)">MEMO</button>
  </div>
  <div class="slot">
    <div class="label" id="lab1" style="color:var(--pink)">EMOTION</div>
    <div class="box" id="box1" onclick="toggleHold(1)" style="border-color:#ff6b9d40"><div class="val" id="v1">—</div></div>
    <button class="hold" id="h1" onclick="toggleShutter(1)">BLIND</button><button class="slot-memo-btn" id="sm1" onclick="openSlotMemo(1)">MEMO</button>
  </div>
  <div class="slot">
    <div class="label" id="lab3" style="color:#c7a8ff">STORY TYPE</div>
    <div class="box" id="box3" onclick="toggleHold(3)" style="border-color:#c7a8ff40"><div class="val" id="v3">—</div></div>
    <button class="hold" id="h3" onclick="toggleShutter(3)">BLIND</button><button class="slot-memo-btn" id="sm3" onclick="openSlotMemo(3)">MEMO</button>
  </div>
</div>
<div id="slotMemoPanel" class="slot-memo-panel">
  <div id="slotMemoTitle" class="slot-memo-title">MEMO / ORIGINAL</div>
  <input id="slotOriginalText" class="slot-original-input" placeholder="オリジナルをリールに追加（任意）">
  <textarea id="slotMemoText" rows="4" placeholder="この要素についてのメモ..."></textarea>
  <div class="slot-memo-actions">
    <button class="slot-add-original" onclick="addOriginalFromMemo()">ADD & HOLD</button>
    <button onclick="saveSlotMemo()">SAVE MEMO</button>
    <button onclick="closeSlotMemo()">CANCEL</button>
  </div>
</div>
<div class="meaning" id="meaning"></div>

<!-- 操作ボタンは常に同じ位置 -->
<div class="control-fixed">
  <button id="startBtn" class="start" onclick="spin()">START</button>
  <div class="row"><button id="saveBtn" class="sub" onclick="openMemo()" disabled>SAVE</button><button id="noteBtn" class="sub" onclick="show('notes')">NOTE</button></div>
</div>
<div class="idea-tools">
 <button id="plusBtn" class="idea-tool" onclick="addWildcard()" disabled>＋1</button>
 <button id="shiftBtn" class="idea-tool" onclick="shiftView()" disabled>SHIFT</button>
 <button class="idea-tool" onclick="revisitSeed()">REVISIT</button>
</div>
<div id="ideaAssist" class="idea-assist"></div>
<!-- PLOTは操作ボタンの下。開閉してもSTART位置は動かない -->
<div class="spacer"></div>
<div class="reset"><button onclick="resetSlots()">RESET</button></div>
<div id="stats" style="text-align:center;color:#181818;font-size:10px;margin-top:3px"></div>
</section>

<section id="memoScreen" class="screen">
<button class="back" onclick="show('slot')">← スロットに戻る</button>
<div id="combo" class="combo"></div>
<div id="memoStoryType" style="display:none;margin:-6px 0 14px;font-size:12px;color:#cdbb62"></div>
<div class="memobox"><label>MEMO</label><textarea id="memo" rows="6" placeholder="この組み合わせからアイデアを書く..."></textarea></div>
<div id="memoAIBox" class="memobox" style="display:none"><label style="color:#7862a7">AI IDEA</label><div id="memoAI" style="font-size:13px;color:#999;line-height:1.7"></div></div>
<button class="complete" onclick="saveMemo()">完了</button>
</section>

<section id="notesScreen" class="screen">
<div class="noteshead"><h2>STOCK</h2><button class="back" onclick="show('slot')">← 戻る</button></div>
<div id="stockList"></div>
<div class="note-bottom-actions">
  <button id="copyAllBtn" class="copy-all" onclick="copyAllStocks()">全コピー</button>
  <button id="clearBtn" class="clear" onclick="clearAll()">全削除</button>
</div>
</section>

<script>
const BASE_WORDS=[

function proceduralWord(){
  const r=Math.random();
  let word="",meaning="";

  if(r<0.34){
    const a=WORD_NOUNS[Math.floor(Math.random()*WORD_NOUNS.length)];
    const b=WORD_SYSTEMS[Math.floor(Math.random()*WORD_SYSTEMS.length)];
    word=a[0]+b[0];
    meaning=`${a[0]}を${b[1]}として扱う概念`;
  }else if(r<0.56){
    const a=WORD_NOUNS[Math.floor(Math.random()*WORD_NOUNS.length)];
    const b=WORD_ACTIONS[Math.floor(Math.random()*WORD_ACTIONS.length)];
    word=a[0]+b[0];
    meaning=`${a[0]}を${b[1]}という発想`;
  }else if(r<0.73){
    const a=WORD_NOUNS[Math.floor(Math.random()*WORD_NOUNS.length)];
    const b=WORD_STATES[Math.floor(Math.random()*WORD_STATES.length)];
    word=a[0]+b[0];
    meaning=`${a[0]}が${b[1]}状態`;
  }else if(r<0.86){
    const p=WORD_PREFIXES[Math.floor(Math.random()*WORD_PREFIXES.length)];
    const a=WORD_NOUNS[Math.floor(Math.random()*WORD_NOUNS.length)];
    word=p+a[0];
    meaning=`${p}という条件がついた${a[0]}`;
  }else{
    const a=WORD_NOUNS[Math.floor(Math.random()*WORD_NOUNS.length)];
    const s=WORD_SUFFIXES[Math.floor(Math.random()*WORD_SUFFIXES.length)];
    word=a[0]+s;
    meaning=`${a[0]}をめぐって生まれた「${s}」的な現象・呼び名`;
  }

  return {word,meaning};
}

function rememberWord(w){
  recentGeneratedWords.unshift(w);
  recentGeneratedWords=[...new Set(recentGeneratedWords)].slice(0,120);
  localStorage.setItem("idea-slot:recent-words",JSON.stringify(recentGeneratedWords));
}

function pickProceduralWord(currentWord){
  for(let i=0;i<40;i++){
    const w=proceduralWord();
    if(w.word!==currentWord && !recentGeneratedWords.includes(w.word)){
      rememberWord(w.word);
      return w;
    }
  }
  const w=proceduralWord();
  rememberWord(w.word);

async function spin(){

 render();

 try{
   const targets=[
     held[0]?slots[0]:pickW(),
     held[1]?slots[1]:pick(emotions(),slots[1]),
     held[2]?slots[2]:pick(people(),slots[2]),
     held[3]?slots[3]:pick(storyTypes(),slots[3])
   ];

   // PERSON → WORD → EMOTION → STORY TYPE
   const order=[2,0,1,3];
   const lists=[words().map(x=>x.word),emotions(),people(),storyTypes()];

   for(const i of order){
     if(held[i]) continue;

     const el=document.getElementById("v"+i);
     let timer=setInterval(()=>{
       const arr=lists[i];
       el.textContent=arr[Math.floor(Math.random()*arr.length)];
     },65);

     await wait(500);
     clearInterval(timer);
     slots[i]=targets[i];
     render();
   }

   slots=targets;
   storyTypeNow=slots[3]||"";
 }finally{
   busy=false;
   render();
 }
}

   return;
 }

 busy=true;
 plotOpen=true;
 document.getElementById("aiCard").classList.add("show");
 document.getElementById("aiText").textContent="考え中...";
 render();

 try{
   aiIdea=await generatePlot(buildPlotPayload());
   previousIdeas.push(aiIdea);
 }finally{
   busy=false;
   plotOpen=true;
   render();
 }
}
function renderAI(){
 const card=document.getElementById("aiCard");if(!card)return;if(!aiIdea||!plotOpen){card.classList.remove("show");return}
 card.classList.add("show");document.getElementById("aiText").textContent=aiIdea;
 const k=document.getElementById("keepBtn");k.textContent=keptIdea===aiIdea?"★ KEPT":"☆ KEEP";k.classList.toggle("on",keptIdea===aiIdea);
}
function keepIdea(){keptIdea=keptIdea===aiIdea?"":aiIdea;renderAI()}

function openMemo(){editId=null;fillMemo("",keptIdea||aiIdea);show("memo")}
function fillMemo(text,idea){
 const e=slots[1],ec="#ff6b9d";
 document.getElementById("combo").innerHTML=`<span class="tag" style="background:#ffd93d15;color:#ffd93d">${escapeText(maskedValue(slots[2],shuttered[2]))}</span>×<span class="tag" style="background:#00e5ff15;color:#00e5ff">${escapeText(maskedValue(slots[0].word,shuttered[0]))}</span>×<span class="tag" style="background:${ec}20;color:${ec}">${escapeText(maskedValue(e,shuttered[1]))}</span>×<span class="tag" style="background:#c7a8ff15;color:#c7a8ff">${escapeText(maskedValue(slots[3],shuttered[3]))}</span>`;
 document.getElementById("memo").value=text||"";
 const st=document.getElementById("memoStoryType");
 if(st){
   if(false){
     st.style.display="none";
     st.textContent="";
   }
 }document.getElementById("memoAIBox").style.display=idea?"block":"none";document.getElementById("memoAI").textContent=idea||"";
}
function saveMemo(){
 const data={
   word:slots[0].word,
   meaning:slots[0].meaning||"",
   wordMemo:slotMemo(0),
   emotion:slots[1],
   emotionMemo:slotMemo(1),
   person:slots[2],
   personMemo:slotMemo(2),
   storyType:slots[3]||storyTypeNow||"",
   storyTypeMemo:slotMemo(3),
   blind:[!!shuttered[0],!!shuttered[1],!!shuttered[2],!!shuttered[3]],
   memo:document.getElementById("memo").value,
   aiIdea:document.getElementById("memoAI").textContent||"",
   used:false
 };
 if(editId){let i=saved.findIndex(x=>x.id===editId);if(i>=0)saved[i]={...saved[i],...data,used:saved[i].used};editId=null;persist();show("notes")}
 else{const now=Date.now();saved.push({id:now,createdAt:now,state:"SEED",used:false,...data});persist();show("slot")}
}
function renderNotes(){
 const list=document.getElementById("stockList"),clear=document.getElementById("clearBtn");
 if(clear)clear.style.display=saved.length?"block":"none";
 const stateOf=s=>s.state||(s.used?"USED":"SEED");
 const counts={ALL:saved.length,SEED:saved.filter(s=>stateOf(s)==="SEED").length,GROW:saved.filter(s=>stateOf(s)==="GROW").length,USED:saved.filter(s=>stateOf(s)==="USED").length};
 const f=stockFilter==="ALL"?saved:saved.filter(s=>stateOf(s)===stockFilter);
 const bar=`<div class="filterbar">${["ALL","SEED","GROW","USED"].map(x=>`<button class="${stockFilter===x?"active":""}" onclick="setStockFilter('${x}')">${x} ${counts[x]}</button>`).join("")}</div>`;
 const copyAllBtn=document.getElementById("copyAllBtn");
 if(copyAllBtn)copyAllBtn.textContent=stockFilter==="ALL"?"全コピー":`${stockFilter} 全コピー`;
 if(!f.length){list.innerHTML=bar+`<div style="text-align:center;color:#555;padding:50px 0">${saved.length?"この状態のSTOCKはありません":"まだストックがありません"}</div>`;return}

 list.innerHTML=bar+f.map(s=>{
  const st=stateOf(s),open=openStockId===s.id,date=formatStockDate(s.createdAt||s.id);
  const blind=stockBlindArray(s);
  const person=maskedValue(s.person,blind[2]);
  const word=maskedValue(s.word,blind[0]);
  const emotion=maskedValue(s.emotion,blind[1]);
  const storyType=maskedValue(s.storyType,blind[3]);

  return `<div class="stock ${st==="USED"?"used":""} ${open?"open":""}" onclick="toggleStockOpen(${s.id},event)">
   <div class="stock-collapsed"><div class="pwe">
    <span class="pwe-item" style="color:var(--gold)">${escapeText(person)}</span><span class="sep">×</span>
    <span class="pwe-item" style="color:var(--cyan)">${escapeText(word)}</span><span class="sep">×</span>
    <span class="pwe-item" style="color:var(--pink)">${escapeText(emotion)}</span><span class="sep">×</span>
    <span class="pwe-item" style="color:#c7a8ff">${escapeText(storyType)}</span>
   </div><span class="stock-state ${st.toLowerCase()}">${st==="USED"?"✓ USED":st}</span>${date?`<span class="stock-date">${date}</span>`:""}</div>
   <div class="stock-expanded">
    
    ${!blind[0]&&s.meaning?`<div class="stockmemo"><div class="stocklabel">WORD MEANING</div>${escapeHTML(s.meaning)}</div>`:""}${!blind[0]&&s.wordMemo?`<div class="stockmemo"><div class="stocklabel">WORD MEMO</div>${escapeHTML(s.wordMemo)}</div>`:""}
    ${!blind[2]&&s.personMemo?`<div class="stockmemo"><div class="stocklabel">PERSON MEMO</div>${escapeHTML(s.personMemo)}</div>`:""}
    ${!blind[1]&&s.emotionMemo?`<div class="stockmemo"><div class="stocklabel">EMOTION MEMO</div>${escapeHTML(s.emotionMemo)}</div>`:""}
    ${!blind[3]&&s.storyTypeMemo?`<div class="stockmemo"><div class="stocklabel">STORY TYPE MEMO</div>${escapeHTML(s.storyTypeMemo)}</div>`:""}${s.memo?`<div class="stockmemo"><div class="stocklabel">MEMO</div>${escapeHTML(s.memo)}</div>`:""}
    <div class="actions"><button class="load" onclick="loadStock(${s.id})">LOAD</button><button onclick="editStock(${s.id})">EDIT</button><button id="cp${s.id}" onclick="copyStock(${s.id})">COPY</button><button class="${st==="USED"?"usedon":""}" onclick="cycleState(${s.id})">${st} → ${st==="SEED"?"GROW":st==="GROW"?"USED":"SEED"}</button><button onclick="del(${s.id})">✕</button></div>
   </div></div>`
 }).join("")
}
function loadStock(id){busy=false;
 const s=saved.find(x=>x.id===id);if(!s)return;let w=words().find(x=>x.word===s.word)||{word:s.word,meaning:s.meaning||""};
 slots=[w,s.emotion,s.person,s.storyType||""];held=[false,false,false,false];storyTypeNow=s.storyType||"";const stEl=document.getElementById("storyTypeValue");if(stEl)stEl.textContent=storyTypeNow||"—";shuttered=stockBlindArray(s).slice();aiIdea=s.aiIdea||"";keptIdea=aiIdea;previousIdeas=aiIdea?[aiIdea]:[];plotOpen=!!aiIdea;show("slot")
}
function editStock(id){
 const s=saved.find(x=>x.id===id);if(!s)return;editId=id;slots=[words().find(x=>x.word===s.word)||{word:s.word,meaning:s.meaning||""},s.emotion,s.person,s.storyType||""];storyTypeNow=s.storyType||"";const stEl=document.getElementById("storyTypeValue");if(stEl)stEl.textContent=storyTypeNow||"—";shuttered=stockBlindArray(s).slice();fillMemo(s.memo,s.aiIdea);show("memo")
}
function toggleUsed(id){let s=saved.find(x=>x.id===id);if(s){s.used=!s.used;openStockId=id;persist();renderNotes()}}
function del(id){
 const s=saved.find(x=>x.id===id);
 const label=s?`${s.person||"—"} × ${s.word||"—"} × ${s.emotion||"—"}`:"このSTOCK";
 if(!confirm(`削除しますか？\n\n${label}\n\nこの操作は元に戻せません。`)) return;
 saved=saved.filter(x=>x.id!==id);
 if(openStockId===id)openStockId=null;
 persist();
 renderNotes();
}

function copyAllStocks(){
 const stateOf=s=>s.state||(s.used?"USED":"SEED");
 const targets=stockFilter==="ALL"?saved:saved.filter(s=>stateOf(s)===stockFilter);
 if(!targets.length){
   alert(`${stockFilter}にコピーするSTOCKがありません。`);
   return;
 }
 const allText=targets.map((s,i)=>{
   const b=stockBlindArray(s),lines=[];
   lines.push(`#${i+1} ${maskedValue(s.person,b[2])} × ${maskedValue(s.word,b[0])} × ${maskedValue(s.emotion,b[1])} × ${maskedValue(s.storyType,b[3])}`);
   lines.push(`STATE: ${stateOf(s)}`);
   const date=formatStockDate(s.createdAt||s.id);
   if(date) lines.push(`DATE: ${date}`);
   
   if(!b[2]&&s.personMemo) lines.push(`PERSON MEMO: ${s.personMemo}`);
   if(!b[0]&&s.meaning) lines.push(`WORD MEANING: ${s.meaning}`);if(!b[0]&&s.wordMemo) lines.push(`WORD MEMO: ${s.wordMemo}`);
   if(!b[1]&&s.emotionMemo) lines.push(`EMOTION MEMO: ${s.emotionMemo}`);if(!b[3]&&s.storyTypeMemo) lines.push(`STORY TYPE MEMO: ${s.storyTypeMemo}`);
   if(s.memo) lines.push(`MEMO:\n${s.memo}`);
   return lines.join("\n");
 }).join("\n\n--------------------\n\n");

 navigator.clipboard.writeText(allText).then(()=>{
   const btn=document.getElementById("copyAllBtn");
   if(btn){
     btn.textContent="COPIED";
     btn.classList.add("copied");
     setTimeout(()=>{btn.textContent=stockFilter==="ALL"?"全コピー":`${stockFilter} 全コピー`;btn.classList.remove("copied")},1500);
   }
 }).catch(()=>alert("コピーできませんでした。"));
}

function clearAll(){
 if(!saved.length)return;
 const ok=confirm(
   `全てのSTOCK（${saved.length}件）を削除しますか？\n\n`+
   `SEED・GROW・USEDを含む全データが消えます。\n`+
   `この操作は元に戻せません。`
 );
 if(!ok)return;

 const second=confirm("本当に全て削除しますか？");
 if(!second)return;

 saved=[];
 openStockId=null;
 persist();
 renderNotes();
}
function copyStock(id){
 const s=saved.find(x=>x.id===id);if(!s)return;
 const b=stockBlindArray(s);
 let t=`${maskedValue(s.person,b[2])} × ${maskedValue(s.word,b[0])} × ${maskedValue(s.emotion,b[1])} × ${maskedValue(s.storyType,b[3])}`;
 
 if(!b[2]&&s.personMemo)t+=`\n${s.person}：${s.personMemo}`;
 if(!b[0]&&s.meaning)t+=`\n${s.word}：${s.meaning}`;if(!b[0]&&s.wordMemo)t+=`\nWORD MEMO：${s.wordMemo}`;
 if(!b[1]&&s.emotionMemo)t+=`\n${s.emotion}：${s.emotionMemo}`;if(!b[3]&&s.storyTypeMemo)t+=`\n${s.storyType}：${s.storyTypeMemo}`;
 if(s.memo)t+=`\n\nMEMO\n${s.memo}`;
 navigator.clipboard.writeText(t).then(()=>{let btn=document.getElementById("cp"+id);if(btn){btn.textContent="COPIED";setTimeout(()=>btn.textContent="COPY",1200)}})
}

function randomDifferent(arr,current){const p=arr.filter(x=>x!==current);return p[Math.floor(Math.random()*p.length)]||arr[0]}
function showAssist(label,main,sub=""){const b=document.getElementById("ideaAssist");b.innerHTML=`<div class="idea-assist-label">${label}</div><div class="idea-assist-main">${escapeText(main)}</div>${sub?`<div class="idea-assist-sub">${escapeText(sub)}</div>`:""}`;b.classList.add("show")}
function clearAssist(){wildcardNow="";shiftNow="";const b=document.getElementById("ideaAssist");if(b){b.classList.remove("show");b.innerHTML=""}}
function addWildcard(){if(!slots.every(Boolean)||busy)return;wildcardNow=randomDifferent(WILDCARDS,wildcardNow);showAssist("＋1 / INTRUDER",wildcardNow,"今の3語に、これだけ追加して考える")}
function shiftView(){if(!slots.every(Boolean)||busy)return;shiftNow=randomDifferent(SHIFT_VIEWS,shiftNow);showAssist("SHIFT / VIEWPOINT",shiftNow,"3語はそのまま。見る角度だけ変える")}
function revisitSeed(){const c=saved.filter(s=>(s.state||(s.used?"USED":"SEED"))!=="USED");if(!c.length){showAssist("REVISIT","再会できる未使用STOCKがありません","SEED / GROWを保存すると、ここに戻ってきます");return}const s=c[Math.floor(Math.random()*c.length)],b=stockBlindArray(s);showAssist("REVISIT",`${maskedValue(s.person,b[2])} × ${maskedValue(s.word,b[0])} × ${maskedValue(s.emotion,b[1])} × ${maskedValue(s.storyType,b[3])}`,formatStockDate(s.createdAt||s.id)+" の種")}
function cycleState(id){const s=saved.find(x=>x.id===id);if(!s)return;const c=s.state||(s.used?"USED":"SEED");s.state=c==="SEED"?"GROW":c==="GROW"?"USED":"SEED";s.used=s.state==="USED";openStockId=id;persist();renderNotes()}
function setStockFilter(v){stockFilter=v;renderNotes()}

function spinStoryType(){
 storyTypeNow=pick(STORY_TYPES,storyTypeNow);
 slots[3]=storyTypeNow;
 render();
}

function show(name){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(name+"Screen").classList.add("active");
 if(name==="notes")renderNotes();if(name==="slot")render()
}
function escapeText(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeHTML(s){return escapeText(s).replace(/\n/g,"<br>")}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
