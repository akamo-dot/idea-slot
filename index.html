<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080f">
<link rel="manifest" href="./manifest.json">
<title>IDEA SLOT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08080f;--surface:#12121f;--border:#1e1e30;--cyan:#00e5ff;--pink:#ff6b9d;--gold:#ffd93d;--purple:#7c4dff;--green:#4ade80;--text:#e2e2ea}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);max-width:480px;margin:auto;min-height:100dvh}
button,textarea,input{font:inherit}button{cursor:pointer}
.screen{display:none;min-height:100dvh;flex-direction:column}.screen.active{display:flex}
.header{text-align:center;padding-top:14px}.header h1{font-size:14px;letter-spacing:6px;color:#444;margin:0}
.slots{display:flex;gap:10px;margin:24px 0 10px}.slot{flex:1;min-width:0;text-align:center}.label{font-size:10px;font-weight:800;letter-spacing:2px;opacity:.7;margin-bottom:6px}
.box{height:90px;border:2px solid;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;position:relative;cursor:pointer;transition:.25s}.box.shuttered:after{content:"";position:absolute;z-index:5;inset:-3px;background:#202027;transform:translateY(0);animation:shutter .18s ease-out;border-radius:12px}.box.shuttered:before{content:"";position:absolute;z-index:6;left:-3px;right:-3px;top:50%;height:2px;background:#2b2b33;box-shadow:0 -22px 0 #2b2b33,0 22px 0 #2b2b33}@keyframes shutter{from{transform:translateY(-105%)}to{transform:translateY(0)}}to{transform:translateY(0)}}
.val{font-size:24px;font-weight:900;line-height:1.15}.hold{margin-top:8px;width:100%;min-height:38px;padding:9px 6px;border-radius:9px;border:1px solid #2d2d3d;background:#11111b;color:#666;font-size:12px;font-weight:900;letter-spacing:2px;transition:.2s}
.meaning{min-height:34px;text-align:center;color:#00e5ff80;font-size:12px}.meaning span{display:inline-block;background:#00e5ff08;padding:8px 12px;border-radius:8px}
.spacer{flex:1}.control-fixed{flex:none}.plotbtn{flex:none;margin-top:14px}
.plotbtn{width:100%;padding:12px;border-radius:11px;border:1px solid #7c4dff55;background:#7c4dff12;color:#a98cff;font-size:16px;font-weight:900;letter-spacing:3px;margin-top:14px;margin-bottom:10px}
.ai{display:none;background:var(--surface);border:1px solid #7c4dff44;border-radius:12px;padding:14px;margin-bottom:12px}.ai.show{display:block}
.aihead{font-size:10px;color:#8d70ff;font-weight:900;letter-spacing:2px;margin-bottom:8px}.aitext{font-size:13px;color:#aaa;line-height:1.75;white-space:pre-wrap}
.aiactions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.mini{padding:6px 10px;border:1px solid #2a2a3c;border-radius:7px;background:transparent;color:#777;font-size:10px;font-weight:800}.mini.on{color:var(--green);border-color:#4ade8055}
.start{width:100%;padding:21px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-size:22px;font-weight:900;letter-spacing:8px}
.row{display:flex;gap:10px;margin-top:10px}.sub{flex:1;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:#444;font-weight:800;letter-spacing:3px;position:relative}
.badge{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#000;font-size:11px}
.reset{text-align:center;margin-top:12px}.reset button{border:0;background:transparent;color:#333;font-size:10px;letter-spacing:3px}
.custom-toggle{border:0;background:transparent;color:#345a61;font-size:9px;margin-top:5px}.custom{display:none;background:#0d0d18;border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:12px}.custom.show{display:block}
.custom input{width:100%;margin-bottom:7px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:#ddd}.custom-actions{display:flex;gap:8px}.custom-actions button{flex:1;padding:9px;border-radius:8px;font-weight:800}.custom button{width:100%;padding:9px;border:0;border-radius:8px;background:#00e5ff15;color:var(--cyan);font-weight:800}
.back{border:0;background:transparent;color:#666;text-align:left;padding:16px 0}.combo{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:18px}.tag{padding:6px 12px;border-radius:8px;font-weight:800}
.memobox{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}.memobox label{display:block;font-size:10px;color:#555;font-weight:900;letter-spacing:1px;margin-bottom:8px}
.memobox textarea{width:100%;border:0;outline:0;resize:vertical;background:transparent;color:#ccc;font-size:14px;line-height:1.7}
.complete{width:100%;padding:16px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#fff;font-weight:900;letter-spacing:2px}
.noteshead{display:flex;justify-content:space-between;align-items:center;margin:14px 0 22px}.noteshead h2{margin:0}.stock{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:.2s;cursor:pointer}
.stock.used{border-color:#4ade8035;background:#101913}
.stock.used .stock-collapsed{opacity:.62}
.stock-collapsed{display:flex;align-items:center;gap:6px;min-height:34px}
.stock-collapsed .pwe{display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.stock-collapsed .pwe-item{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-collapsed .sep{color:#333;font-size:11px}
.stock-date{font-size:9px;color:#3f3f49;white-space:nowrap;margin-left:6px}
.stock-used-mark{font-size:9px;font-weight:900;color:var(--green);letter-spacing:.5px;white-space:nowrap}
.stock-expanded{display:none;padding-top:10px;border-top:1px solid #1b1b28;margin-top:8px}
.stock.open .stock-expanded{display:block}
.stock.open .stock-collapsed{margin-bottom:2px}
.stock.open{border-color:#2a2a3b}
.stocktags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.stockmemo,.stockai{padding-left:24px;margin-top:9px;color:#999;font-size:13px;line-height:1.6}.stockai{color:#817b95}.stocklabel{font-size:9px;color:#555;font-weight:900;letter-spacing:1px}
.actions{display:flex;gap:6px;flex-wrap:wrap;padding-left:24px;margin-top:11px}.actions button{padding:6px 9px;border:1px solid #29293b;border-radius:7px;background:transparent;color:#666;font-size:10px;font-weight:800}.actions .load{color:#8f72ff;border-color:#7c4dff66}.actions .usedon{color:var(--green);border-color:#4ade8055}
.clear{width:100%;padding:10px;border:1px solid #421a1a;border-radius:8px;background:transparent;color:#ef4444;margin:12px 0 25px}

.idea-tools{display:flex;gap:8px;margin-top:12px}
.idea-tool{flex:1;padding:11px 5px;border-radius:10px;border:1px solid #242437;background:#10101b;color:#777;font-size:11px;font-weight:900;letter-spacing:1.2px}
.idea-tool:disabled{opacity:.25}.idea-assist{display:none;margin-top:10px;padding:12px 14px;border:1px solid #252538;border-radius:11px;background:#0e0e18;line-height:1.55}
.idea-assist.show{display:block}.idea-assist-label{font-size:9px;font-weight:900;letter-spacing:2px;color:#555;margin-bottom:5px}.idea-assist-main{font-size:17px;font-weight:850;color:#eee}.idea-assist-sub{font-size:11px;color:#666;margin-top:4px}
.stock-state{font-size:9px;font-weight:900;letter-spacing:.5px;white-space:nowrap}.stock-state.seed{color:#777}.stock-state.grow{color:#ffd93d}.stock-state.used{color:#4ade80}
.filterbar{display:flex;gap:6px;margin-bottom:14px}.filterbar button{flex:1;padding:8px 3px;border:1px solid #222233;border-radius:8px;color:#555;font-size:9px;font-weight:900}.filterbar button.active{border-color:#555;color:#bbb;background:#151520}

.hold.is-held{background:rgba(255,255,255,.04);box-shadow:0 0 12px rgba(255,255,255,.04)}
.story-type-wrap{margin-top:16px;padding:14px;border:1px solid #222235;border-radius:12px;background:#0d0d17}
.story-type-label{font-size:10px;font-weight:900;letter-spacing:2px;color:#666;margin-bottom:8px}
.story-type-value{min-height:44px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#f0f0f5;letter-spacing:1px}
.story-type-btn{width:100%;margin-top:10px;padding:12px;border-radius:10px;border:1px solid #ffd93d44;background:#ffd93d0d;color:#ffd93d;font-size:12px;font-weight:900;letter-spacing:2px}
.story-type-btn:active{transform:scale(.99)}


.note-bottom-actions{display:flex;gap:10px;margin:12px 0 25px}
.note-bottom-actions .clear{flex:1;margin:0}
.copy-all{flex:1;padding:10px;border:1px solid #2f2f48;border-radius:8px;background:transparent;color:#8f72ff;font-size:13px;font-weight:800;letter-spacing:1px}
.copy-all.copied{color:#4ade80;border-color:#4ade8055}

</style>
</head>
<body>

<section id="slotScreen" class="screen active">
<div class="header"><h1>IDEA SLOT</h1></div>
<div class="slots">
  <div class="slot"><div class="label" id="lab2" style="color:var(--gold)">PERSON</div><div class="box" id="box2" onclick="toggleShutter(2)" style="border-color:#ffd93d40"><div class="val" id="v2">—</div></div><button class="hold" id="h2" onclick="toggleHold(2)">HOLD</button><br><button class="custom-toggle" onclick="toggleCustom(2)">+ PERSON</button></div>
  <div class="slot"><div class="label" id="lab0" style="color:var(--cyan)">WORD</div><div class="box" id="box0" onclick="toggleShutter(0)" style="border-color:#00e5ff40"><div class="val" id="v0">—</div></div><button class="hold" id="h0" onclick="toggleHold(0)">HOLD</button><br><button class="custom-toggle" onclick="toggleCustom(0)">+ WORD</button></div>
  <div class="slot"><div class="label" id="lab1" style="color:var(--pink)">EMOTION</div><div class="box" id="box1" onclick="toggleShutter(1)" style="border-color:#ff6b9d40"><div class="val" id="v1">—</div></div><button class="hold" id="h1" onclick="toggleHold(1)">HOLD</button><br><button class="custom-toggle" onclick="toggleCustom(1)">+ EMOTION</button></div>
</div>
<div id="custom" class="custom"><input id="cw" placeholder="追加する内容"><input id="cm" placeholder="意味・背景メモ（任意）"><div class="custom-actions"><button id="customAddBtn" onclick="addCustom()">ADD & HOLD</button><button onclick="closeCustom()" style="background:transparent;color:#666;border:1px solid #2a2a35">CANCEL</button></div></div>
<div class="meaning" id="meaning"></div>

<!-- 操作ボタンは常に同じ位置 -->
<div class="control-fixed">
  <button id="startBtn" class="start" onclick="spin()">START</button>
  <div class="row"><button id="saveBtn" class="sub" onclick="openMemo()" disabled>SAVE</button><button id="noteBtn" class="sub" onclick="show('notes')">NOTE</button></div>
</div>
<div class="idea-tools">
 <button id="plusBtn" class="idea-tool" onclick="addWildcard()" disabled>＋1</button>
 <button id="shiftBtn" class="idea-tool" onclick="shiftView()" disabled>SHIFT</button>
 <button class="idea-tool" onclick="revisitSeed()">REVISIT</button>
</div>
<div id="ideaAssist" class="idea-assist"></div>

<div class="story-type-wrap">
  <div class="story-type-label">STORY TYPE</div>
  <div id="storyTypeValue" class="story-type-value">—</div>
  <button class="story-type-btn" onclick="spinStoryType()">ROULETTE</button>
</div>


<!-- PLOTは操作ボタンの下。開閉してもSTART位置は動かない -->
<div class="spacer"></div>
<div class="reset"><button onclick="resetSlots()">RESET</button></div>
<div id="stats" style="text-align:center;color:#181818;font-size:10px;margin-top:3px"></div>
</section>

<section id="memoScreen" class="screen">
<button class="back" onclick="show('slot')">← スロットに戻る</button>
<div id="combo" class="combo"></div>
<div class="memobox"><label>MEMO</label><textarea id="memo" rows="6" placeholder="この組み合わせからアイデアを書く..."></textarea></div>
<div id="memoAIBox" class="memobox" style="display:none"><label style="color:#7862a7">AI IDEA</label><div id="memoAI" style="font-size:13px;color:#999;line-height:1.7"></div></div>
<button class="complete" onclick="saveMemo()">完了</button>
</section>

<section id="notesScreen" class="screen">
<div class="noteshead"><h2>STOCK</h2><button class="back" onclick="show('slot')">← 戻る</button></div>
<div id="stockList"></div>
<div class="note-bottom-actions">
  <button id="copyAllBtn" class="copy-all" onclick="copyAllStocks()">全コピー</button>
  <button id="clearBtn" class="clear" onclick="clearAll()">全削除</button>
</div>
</section>

<script>
const BASE_WORDS=[
["凸る","突撃する・押しかける"],["沼る","ハマって抜け出せなくなる"],["死","終わり・究極の状態"],["たらこ","鱈の卵の塩漬け食品"],["運動","身体を動かすこと"],["推し","応援している人・もの"],["エモい","感情が揺さぶられる感覚"],["ガチ","本気で・マジで"],["バズる","SNSで大きく拡散される"],["詰む","行き詰まる・終わる"],["尊い","崇高で美しい存在"],["草","笑い"],["桜","春に咲く日本の花"],["重力","物体を引きつける力"],["炎上","批判が殺到すること"],["寿司","酢飯と生魚の料理"],["闇","暗い・裏の世界"],["覚醒","目覚める・能力が開花"],["量子","物質の最小単位"],["廃墟","放棄された建物"],["泡","液体の中にできる空気の球"],["メタバース","仮想空間の総称"],["生成AI","コンテンツを自動生成するAI"],["タイパ","タイムパフォーマンス"],["蛙化","好きだった相手が急に嫌になる"],["限界","これ以上進めない境界"],["匂い","鼻で感じる感覚"],["祭","神事・イベント・盛り上がり"],["借金","お金を借りること"],["変態","形が変わること・異常な状態"],["筋肉","身体を動かす組織"],["秘密","隠されていること"],["爆発","急激に膨張すること"],["納豆","大豆を発酵させた食品"],["宇宙","地球の外の空間すべて"],["ゾーン","集中が極限に達した状態"],["界隈","特定の分野・コミュニティ"],["チルい","リラックスした状態"],["ぴえん","泣きたいくらいの感情表現"],["それな","強い同意・共感"]
].map(x=>({word:x[0],meaning:x[1]}));

const EMOTIONS=["喜び","不穏","悲しみ","無感情","たいくつ","怒り","驚き","恐怖","嫉妬","感動","焦り","安心","困惑","高揚","虚無","恥ずかしさ","懐かしさ","切なさ","ワクワク","ゾクゾク","もどかしさ","罪悪感","優越感","孤独","幸福","寂しさ","後悔","期待","失望","緊張","開放感","安堵","絶望","希望","諦め","愛情","恋","執着","憧れ","嫌悪","違和感","疑い","羞恥","退屈","倦怠","興奮","熱狂","陶酔","満足","不満","羨望","憎しみ","慈しみ","哀れみ","親近感","疎外感","喪失感","達成感","無力感","解放","爽快","ほっこり","くだらなさ","笑い","気まずさ"];
const PEOPLE=["学生","消防士","赤ちゃん","主夫","首脳","社長","漁師","宇宙飛行士","忍者","看護師","ユーチューバー","僧侶","探偵","ギャル","老人","海賊","料理人","バスガイド","泥棒","科学者","アイドル","力士","占い師","審判","ホームレス","双子","新人","女王","ロボット","幽霊","小学生","高校生","大学生","幼児","母親","父親","祖母","祖父","孫","夫","妻","恋人","元恋人","新婚夫婦","シングルマザー","教師","校長","保育士","医師","歯科医","薬剤師","介護士","警察官","裁判官","弁護士","政治家","官僚","市長","駅員","運転手","会社員","上司","部下","人事担当","営業マン","デザイナー","エンジニア","プログラマー","作家","漫画家","画家","写真家","音楽家","俳優","芸人","美容師","店員","配達員","清掃員","警備員","農家","猟師","大工","職人","研究者","転校生","留学生","観光客","迷子","患者","囚人","詐欺師","殺し屋","スパイ","勇者","魔王","宇宙人","未来人","過去の人","クローン","AI","アンドロイド","神","悪魔","天使","犬","猫","カラス","蚊","ゴキブリ","人魚","怪獣","恐竜","虫","植物"];
const C=["#00e5ff","#ff6b9d","#ffd93d"];

let custom=JSON.parse(localStorage.getItem("idea-slot:custom")||"[]");
let customEmotions=JSON.parse(localStorage.getItem("idea-slot:custom-emotions")||"[]");
let customPeople=JSON.parse(localStorage.getItem("idea-slot:custom-people")||"[]");
let customType=0;
let saved=JSON.parse(localStorage.getItem("idea-slot:stocks")||"[]").map(s=>({...s,createdAt:s.createdAt||s.id||null,used:!!s.used,state:s.state||(s.used?"USED":"SEED")}));


const STORY_TYPES=[
  "不穏","喪失","幸福","笑い","恋愛","ミステリー","犯罪","家族",
  "食","身体","仕事","宇宙","ナンセンス","感動","完全に変",
  "切ない","爽快","皮肉","ほっこり","ホラー","青春","社会風刺",
  "ブラックユーモア","冒険","日常","寓話","会話劇","一発ネタ"
];
let storyTypeNow="";

const WILDCARDS=["宇宙","コンビニ","病院","学校","葬式","結婚式","裁判所","電車","海","月","地下","100年後","昨日","最後の日","無人島","老人ホーム","SNS","夢","祭り","会社","家族","お金","法律","ランキング","サブスク","レンタル","中古","無料","禁止","税金","保険","匂い","音","体温","名前","記憶","睡眠","食事","ゴミ","天気","鏡","写真","手紙"];
const SHIFT_VIEWS=["過去","現在","未来","家庭","会社","社会","子どもの目","老人の目","日本","海外","宇宙","日常","制度","極端","逆の立場","犯罪","恋愛","仕事","商売","教育","身体","死後","100年後","誰にも知られない場所","全員が知っている世界"];
let wildcardNow="",shiftNow="",stockFilter="ALL";
let slots=[null,null,null],held=[false,false,false],shuttered=[false,false,false],busy=false,editId=null;
let aiIdea="",keptIdea="",previousIdeas=[],plotOpen=false;

const words=()=>[...BASE_WORDS,...custom];
const emotions=()=>[...EMOTIONS,...customEmotions.map(x=>x.value)];
const people=()=>[...PEOPLE,...customPeople.map(x=>x.value)];
function slotMemo(i){if(i===0)return slots[0]?.meaning||"";if(i===1)return customEmotions.find(x=>x.value===slots[1])?.memo||"";return customPeople.find(x=>x.value===slots[2])?.memo||""}
const persist=()=>localStorage.setItem("idea-slot:stocks",JSON.stringify(saved));
function formatStockDate(ts){
  if(!ts) return "";
  const d=new Date(ts);
  if(Number.isNaN(d.getTime())) return "";
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  const hh=String(d.getHours()).padStart(2,"0");
  const mm=String(d.getMinutes()).padStart(2,"0");
  return `${y}.${m}.${day} ${hh}:${mm}`;
}
let openStockId=null;
function toggleStockOpen(id,event){
  if(event && event.target.closest("button")) return;
  openStockId = openStockId===id ? null : id;
  renderNotes();
}
const val=i=>i===0?(slots[0]?.word||"—"):(slots[i]||"—");
const pick=(a,current)=>{let b=a.filter(x=>x!==current);if(!b.length)b=a;return b[Math.floor(Math.random()*b.length)]};
const pickW=()=>{let a=words().filter(x=>x.word!==slots[0]?.word);return a[Math.floor(Math.random()*a.length)]};

function render(){
 for(let i=0;i<3;i++){
   const v=document.getElementById("v"+i),b=document.getElementById("box"+i),h=document.getElementById("h"+i),l=document.getElementById("lab"+i);
   v.textContent=val(i);v.style.fontSize=val(i).length>5?"18px":"24px";
   b.style.borderColor=held[i]?C[i]:C[i]+"40";b.style.boxShadow=held[i]?`0 0 16px ${C[i]}30`:"none";
   l.innerHTML=(held[i]?"● ":"")+["WORD","EMOTION","PERSON"][i];h.disabled=!slots[i]||busy;h.textContent="HOLD";h.style.color=held[i]?C[i]:"#666";h.classList.toggle("is-held",held[i]);h.style.borderColor=held[i]?C[i]+"88":"#2d2d3d";b.classList.toggle("shuttered",shuttered[i]);
 }
 const notes=[];if(slotMemo(2))notes.push(`PERSON：${escapeText(slotMemo(2))}`);if(slotMemo(0))notes.push(`WORD：${escapeText(slotMemo(0))}`);if(slotMemo(1))notes.push(`EMOTION：${escapeText(slotMemo(1))}`);document.getElementById("meaning").innerHTML=notes.length?`<span>${notes.join("　/　")}</span>`:"";
 const all=held.every(Boolean);
 const sb=document.getElementById("startBtn");sb.disabled=busy||all;sb.textContent=busy?"...":all?"ALL HELD":"START";sb.style.opacity=sb.disabled?.35:1;
 document.getElementById("saveBtn").disabled=busy||!slots.every(Boolean);
 document.getElementById("saveBtn").style.color=(!busy&&slots.every(Boolean))?"var(--purple)":"#444";
 const pbtn=document.getElementById("plotBtn");if(pbtn)pbtn.disabled=busy||!slots.every(Boolean)||activePlotCount()===0;
 const nb=document.getElementById("noteBtn");nb.innerHTML="NOTE"+(saved.length?`<span class="badge">${saved.length}</span>`:"");nb.style.color=saved.length?"var(--gold)":"#444";
 document.getElementById("stats").textContent=`${words().length}w · ${emotions().length}e · ${people().length}p`;
 renderAI();
 const ideaReady=slots.every(Boolean)&&!busy;
 const pb=document.getElementById("plusBtn"),shb=document.getElementById("shiftBtn");if(pb)pb.disabled=!ideaReady;if(shb)shb.disabled=!ideaReady;
}
function toggleHold(i){if(slots[i]){held[i]=!held[i];render()}}
function toggleShutter(i){if(slots[i]&&!busy){shuttered[i]=!shuttered[i];render()}}
function invalidateAI(){aiIdea="";keptIdea="";previousIdeas=[];plotOpen=false;renderAI()}
async function spin(){
 clearAssist();
 if(busy||held.every(Boolean))return;
 busy=true;
 render();

 try{
   const targets=[
     held[0]?slots[0]:pickW(),
     held[1]?slots[1]:pick(EMOTIONS,slots[1]),
     held[2]?slots[2]:pick(PEOPLE,slots[2])
   ];

   // PERSON → WORD → EMOTION の順に停止
   const order=[2,0,1];
   const lists=[words().map(x=>x.word),EMOTIONS,PEOPLE];

   for(const i of order){
     if(held[i]) continue;

     const el=document.getElementById("v"+i);
     let timer=setInterval(()=>{
       const arr=lists[i];
       el.textContent=arr[Math.floor(Math.random()*arr.length)];
     },65);

     await wait(550);
     clearInterval(timer);
     slots[i]=targets[i];
     render();
   }

   slots=targets;
 }finally{
   busy=false;
   render();
 }
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function buildPlotPayload(){
  const payload={previousIdeas};

  // シャッターが閉じている要素はAI IDEAへ一切渡さない
  if(!shuttered[0]){
    payload.word=slots[0]?.word||"";
    payload.meaning=slots[0]?.meaning||"";
    payload.wordNote=slots[0]?.meaning||"";
  }
  if(!shuttered[1]){
    payload.emotion=slots[1]||"";
    payload.emotionNote=slotMemo(1)||"";
  }
  if(!shuttered[2]){
    payload.person=slots[2]||"";
    payload.personNote=slotMemo(2)||"";
  }

  return payload;
}

function activePlotCount(){
  return [0,1,2].filter(i=>slots[i] && !shuttered[i]).length;
}
function resetSlots(){slots=[null,null,null];held=[false,false,false];shuttered=[false,false,false];invalidateAI();render()}
function toggleCustom(type){
 customType=type;
 const panel=document.getElementById("custom");
 panel.classList.toggle("show");
 const names=["WORD","EMOTION","PERSON"];
 document.getElementById("cw").placeholder=`自分の${names[type]}`;
 document.getElementById("cm").placeholder="意味・背景メモ（任意）";
}
function closeCustom(){document.getElementById("custom").classList.remove("show")}
function addCustom(){
 const v=document.getElementById("cw").value.trim(),m=document.getElementById("cm").value.trim();if(!v)return;
 if(customType===0){
   let obj=words().find(x=>x.word===v);if(!obj){obj={word:v,meaning:m};custom.push(obj);localStorage.setItem("idea-slot:custom",JSON.stringify(custom))}
   slots[0]=obj;held[0]=true;
 }else if(customType===1){
   if(!customEmotions.some(x=>x.value===v)){customEmotions.push({value:v,memo:m});localStorage.setItem("idea-slot:custom-emotions",JSON.stringify(customEmotions))}
   slots[1]=v;held[1]=true;
 }else{
   if(!customPeople.some(x=>x.value===v)){customPeople.push({value:v,memo:m});localStorage.setItem("idea-slot:custom-people",JSON.stringify(customPeople))}
   slots[2]=v;held[2]=true;
 }
 document.getElementById("cw").value="";document.getElementById("cm").value="";closeCustom();invalidateAI();render();
}

/* AI hook:
   現在は端末内モック。GitHub Pagesに秘密APIキーは置かない。
   後でこの関数だけ、Cloudflare Worker / Vercel Function等の安全なAPIへ差し替える。 */
async function generatePlot(p){
 await wait(500);

 const hasWord=!!p.word;
 const hasEmotion=!!p.emotion;
 const hasPerson=!!p.person;

 // シャッターで隠された要素はp自体に存在しない。
 // 以下は「渡された要素だけ」で組み立てる。
 const subject = hasPerson ? p.person : "ある人物";
 const key = hasWord ? `「${p.word}」` : "日常の小さな違和感";
 const tone = hasEmotion ? `${p.emotion}が残る` : "意味があとから反転する";

 const wordExtra = hasWord && (p.wordNote||p.meaning)
   ? `「${p.wordNote||p.meaning}」という意味・背景を文字どおりではなく別の角度から使う。`
   : "";
 const emotionExtra = hasEmotion && p.emotionNote
   ? `${p.emotionNote}という補足も、感情の理由として使う。`
   : "";
 const personExtra = hasPerson && p.personNote
   ? `${p.personNote}という人物メモを、その立場や行動に反映する。`
   : "";

 const variations=[
  {
   idea:`${key}を、最初に思いつく意味から少しずらして物語の核にする。${hasPerson?`${subject}の立場から始め、`:""}${tone}構造にする。${wordExtra}`,
   opening:`${subject}の日常で、${hasWord?`${key}に関する`:""}些細な異常が起きる。本人には大したことではないように見えるが、周囲との認識が少しだけ噛み合わない。`,
   payoff:`序盤では普通に見えた出来事が、別の意味だったと分かる。${hasWord?`${key}の意味を反転させ、`:""}${hasPerson?"主人公の立場と結びつけて、":""}冒頭の違和感を回収する。${emotionExtra}${personExtra}`,
   ending:`問題が片づいたように見えた直後、${hasEmotion?`${p.emotion}だけが別の意味で残る。`:"最初の一言の意味だけが変わって見える。"}`
  },
  {
   idea:`${hasWord?`${key}を売買・貸し借りできるものとして扱う。`:"人が普段は売買できないものを取引する話にする。"}${hasPerson?`${subject}をその取引の当事者にする。`:""}${tone}方向へ転がす。`,
   opening:`${subject}の前に、妙なサービスが現れる。説明は短く、使ってみるまで何が起きるのか分からない。`,
   payoff:`利用者が増えるほど、便利さとは別の代価が見えてくる。${hasWord?`${key}を手放すことで失っていたものが判明する。`:"取引の対象より、手放した側の変化が本当の代価だったと分かる。"}${emotionExtra}`,
   ending:`返してほしいと言ったとき、もう元の状態には戻せないことだけが淡々と告げられる。`
  },
  {
   idea:`${hasWord?`${key}を「見える／見えない」の問題に変える。`:"人によって見えている現実が違う話にする。"}${hasPerson?`${subject}だけが周囲と違う認識を持つ。`:""}${tone}ようにする。`,
   opening:`朝、${subject}は周囲が当然のように扱っている何かを、自分だけ認識できないことに気づく。`,
   payoff:`消えたのではなく、共通認識の方が書き換わっていたと分かる。${hasWord?`${key}がその境界線だった。`:""}${personExtra}`,
   ending:`最後に、主人公自身も「見える側／見えない側」のどちらなのか分からなくなる。`
  },
  {
   idea:`${hasWord?`${key}の意味が世代や時代で変わることを使う。`:"同じものを見ても意味が違う、というズレを使う。"}${hasPerson?`${subject}だけが古い意味を信じている。`:""}${tone}話にする。`,
   opening:`${subject}が何気なく一言を口にする。周囲が一斉に黙るが、本人には理由が分からない。`,
   payoff:`調べるほど、誰も同じ意味でその言葉や行動を受け取っていなかったことが分かる。冒頭は間違いではなく、解釈だけがずれていた。`,
   ending:`いちばん若い人物が、さらに別の意味を口にして終わる。`
  },
  {
   idea:`${hasWord?`${key}を制度や技術ではなく、個人的な癖・記憶として扱う。`:"小さな個人的習慣から始める。"}${hasPerson?`${subject}本人は価値を自覚していない。`:""}${tone}話にする。`,
   opening:`${subject}は毎日、誰にも頼まれていない小さな行動を続けている。周囲は少し呆れている。`,
   payoff:`その行動を真似する人が増え、本人には見えていなかった影響が広がる。${hasWord?`${key}は最後に最初とは違う意味を持つ。`:""}${wordExtra}`,
   ending:`本人だけは何も成し遂げたつもりがなく、いつも通り同じことを続けている。`
  }
 ];

 let available=variations.filter(v=>!p.previousIdeas?.includes(JSON.stringify(v)));
 if(!available.length) available=variations;
 const v=available[Math.floor(Math.random()*available.length)];

 return `【着想】
${v.idea}

【冒頭】
${v.opening}

【回収】
${v.payoff}

【最後】
${v.ending}`;
}
async function makePlot(forceAnother=false){
 if(busy||!slots.every(Boolean)||activePlotCount()===0)return;

 // PLOT button: show/hide existing plot
 if(!forceAnother && aiIdea){
   plotOpen=!plotOpen;
   renderAI();
   return;
 }

 busy=true;
 plotOpen=true;
 document.getElementById("aiCard").classList.add("show");
 document.getElementById("aiText").textContent="考え中...";
 render();

 try{
   aiIdea=await generatePlot(buildPlotPayload());
   previousIdeas.push(aiIdea);
 }finally{
   busy=false;
   plotOpen=true;
   render();
 }
}
function renderAI(){
 const card=document.getElementById("aiCard");if(!card)return;if(!aiIdea||!plotOpen){card.classList.remove("show");return}
 card.classList.add("show");document.getElementById("aiText").textContent=aiIdea;
 const k=document.getElementById("keepBtn");k.textContent=keptIdea===aiIdea?"★ KEPT":"☆ KEEP";k.classList.toggle("on",keptIdea===aiIdea);
}
function keepIdea(){keptIdea=keptIdea===aiIdea?"":aiIdea;renderAI()}

function openMemo(){editId=null;fillMemo("",keptIdea||aiIdea);show("memo")}
function fillMemo(text,idea){
 const e=slots[1],ec="#ff6b9d";
 document.getElementById("combo").innerHTML=`<span class="tag" style="background:#00e5ff15;color:#00e5ff">${escapeText(slots[0].word)}</span>×<span class="tag" style="background:${ec}20;color:${ec}">${escapeText(e)}</span>×<span class="tag" style="background:#ffd93d15;color:#ffd93d">${escapeText(slots[2])}</span>`;
 document.getElementById("memo").value=text||"";document.getElementById("memoAIBox").style.display=idea?"block":"none";document.getElementById("memoAI").textContent=idea||"";
}
function saveMemo(){
 const data={word:slots[0].word,meaning:slots[0].meaning||"",emotion:slots[1],emotionMemo:slotMemo(1),person:slots[2],personMemo:slotMemo(2),memo:document.getElementById("memo").value,aiIdea:document.getElementById("memoAI").textContent||"",used:false};
 if(editId){let i=saved.findIndex(x=>x.id===editId);if(i>=0)saved[i]={...saved[i],...data,used:saved[i].used};editId=null;persist();show("notes")}
 else{const now=Date.now();saved.push({id:now,createdAt:now,state:"SEED",used:false,...data});persist();show("slot")}
}
function renderNotes(){
 const list=document.getElementById("stockList"),clear=document.getElementById("clearBtn");
 if(clear)clear.style.display=saved.length?"block":"none";
 const stateOf=s=>s.state||(s.used?"USED":"SEED");
 const counts={ALL:saved.length,SEED:saved.filter(s=>stateOf(s)==="SEED").length,GROW:saved.filter(s=>stateOf(s)==="GROW").length,USED:saved.filter(s=>stateOf(s)==="USED").length};
 const f=stockFilter==="ALL"?saved:saved.filter(s=>stateOf(s)===stockFilter);
 const bar=`<div class="filterbar">${["ALL","SEED","GROW","USED"].map(x=>`<button class="${stockFilter===x?"active":""}" onclick="setStockFilter('${x}')">${x} ${counts[x]}</button>`).join("")}</div>`;
 if(!f.length){list.innerHTML=bar+`<div style="text-align:center;color:#555;padding:50px 0">${saved.length?"この状態のSTOCKはありません":"まだストックがありません"}</div>`;return}
 list.innerHTML=bar+f.map(s=>{
  const st=stateOf(s),open=openStockId===s.id,date=formatStockDate(s.createdAt||s.id);
  return `<div class="stock ${st==="USED"?"used":""} ${open?"open":""}" onclick="toggleStockOpen(${s.id},event)">
   <div class="stock-collapsed"><div class="pwe">
    <span class="pwe-item" style="color:var(--gold)">${escapeText(s.person||"—")}</span><span class="sep">×</span>
    <span class="pwe-item" style="color:var(--cyan)">${escapeText(s.word||"—")}</span><span class="sep">×</span>
    <span class="pwe-item" style="color:var(--pink)">${escapeText(s.emotion||"—")}</span>
   </div><span class="stock-state ${st.toLowerCase()}">${st==="USED"?"✓ USED":st}</span>${date?`<span class="stock-date">${date}</span>`:""}</div>
   <div class="stock-expanded">
    ${s.meaning?`<div class="stockmemo"><div class="stocklabel">WORD MEMO</div>${escapeHTML(s.meaning)}</div>`:""}
    ${s.personNote?`<div class="stockmemo"><div class="stocklabel">PERSON MEMO</div>${escapeHTML(s.personNote)}</div>`:""}
    ${s.emotionNote?`<div class="stockmemo"><div class="stocklabel">EMOTION MEMO</div>${escapeHTML(s.emotionNote)}</div>`:""}
    ${s.memo?`<div class="stockmemo"><div class="stocklabel">MEMO</div>${escapeHTML(s.memo)}</div>`:""}
    <div class="actions"><button class="load" onclick="loadStock(${s.id})">LOAD</button><button onclick="editStock(${s.id})">EDIT</button><button id="cp${s.id}" onclick="copyStock(${s.id})">COPY</button><button class="${st==="USED"?"usedon":""}" onclick="cycleState(${s.id})">${st} → ${st==="SEED"?"GROW":st==="GROW"?"USED":"SEED"}</button><button onclick="del(${s.id})">✕</button></div>
   </div></div>`
 }).join("")
}
function loadStock(id){
 const s=saved.find(x=>x.id===id);if(!s)return;let w=words().find(x=>x.word===s.word)||{word:s.word,meaning:s.meaning||""};
 slots=[w,s.emotion,s.person];held=[true,true,true];shuttered=[false,false,false];aiIdea=s.aiIdea||"";keptIdea=aiIdea;previousIdeas=aiIdea?[aiIdea]:[];plotOpen=!!aiIdea;show("slot")
}
function editStock(id){
 const s=saved.find(x=>x.id===id);if(!s)return;editId=id;slots=[words().find(x=>x.word===s.word)||{word:s.word,meaning:s.meaning||""},s.emotion,s.person];fillMemo(s.memo,s.aiIdea);show("memo")
}
function toggleUsed(id){let s=saved.find(x=>x.id===id);if(s){s.used=!s.used;openStockId=id;persist();renderNotes()}}
function del(id){
 const s=saved.find(x=>x.id===id);
 const label=s?`${s.person||"—"} × ${s.word||"—"} × ${s.emotion||"—"}`:"このSTOCK";
 if(!confirm(`削除しますか？\n\n${label}\n\nこの操作は元に戻せません。`)) return;
 saved=saved.filter(x=>x.id!==id);
 if(openStockId===id)openStockId=null;
 persist();
 renderNotes();
}

function copyAllStocks(){
 if(!saved.length){
   alert("コピーするSTOCKがありません。");
   return;
 }

 const stateOf=s=>s.state||(s.used?"USED":"SEED");

 const text=saved.map((s,i)=>{
   const lines=[];
   lines.push(`#${i+1} ${s.person||"—"} × ${s.word||"—"} × ${s.emotion||"—"}`);
   lines.push(`STATE: ${stateOf(s)}`);

   const date=formatStockDate(s.createdAt||s.id);
   if(date) lines.push(`DATE: ${date}`);

   if(s.meaning) lines.push(`WORD MEMO: ${s.meaning}`);
   if(s.personNote) lines.push(`PERSON MEMO: ${s.personNote}`);
   if(s.emotionNote) lines.push(`EMOTION MEMO: ${s.emotionNote}`);
   if(s.memo) lines.push(`MEMO:\n${s.memo}`);
   if(s.aiIdea) lines.push(`AI IDEA:\n${s.aiIdea}`);

   return lines.join("\n");
 }).join("\n\n--------------------\n\n");

 navigator.clipboard.writeText(text).then(()=>{
   const btn=document.getElementById("copyAllBtn");
   if(btn){
     btn.textContent="COPIED";
     btn.classList.add("copied");
     setTimeout(()=>{
       btn.textContent="全コピー";
       btn.classList.remove("copied");
     },1500);
   }
 }).catch(()=>{
   alert("コピーできませんでした。");
 });
}

function clearAll(){
 if(!saved.length)return;
 const ok=confirm(
   `全てのSTOCK（${saved.length}件）を削除しますか？\n\n`+
   `SEED・GROW・USEDを含む全データが消えます。\n`+
   `この操作は元に戻せません。`
 );
 if(!ok)return;

 const second=confirm("本当に全て削除しますか？");
 if(!second)return;

 saved=[];
 openStockId=null;
 persist();
 renderNotes();
}
function copyStock(id){
 const s=saved.find(x=>x.id===id);let t=`${s.word} × ${s.emotion} × ${s.person}`;if(s.personMemo)t+=`\n${s.person}：${s.personMemo}`;if(s.meaning)t+=`\n${s.word}：${s.meaning}`;if(s.emotionMemo)t+=`\n${s.emotion}：${s.emotionMemo}`;if(s.memo)t+=`\n\nMEMO\n${s.memo}`;if(s.aiIdea)t+=`\n\nAI IDEA\n${s.aiIdea}`;
 navigator.clipboard.writeText(t).then(()=>{let b=document.getElementById("cp"+id);b.textContent="COPIED";setTimeout(()=>b.textContent="COPY",1200)})
}

function randomDifferent(arr,current){const p=arr.filter(x=>x!==current);return p[Math.floor(Math.random()*p.length)]||arr[0]}
function showAssist(label,main,sub=""){const b=document.getElementById("ideaAssist");b.innerHTML=`<div class="idea-assist-label">${label}</div><div class="idea-assist-main">${escapeText(main)}</div>${sub?`<div class="idea-assist-sub">${escapeText(sub)}</div>`:""}`;b.classList.add("show")}
function clearAssist(){wildcardNow="";shiftNow="";const b=document.getElementById("ideaAssist");if(b){b.classList.remove("show");b.innerHTML=""}}
function addWildcard(){if(!slots.every(Boolean)||busy)return;wildcardNow=randomDifferent(WILDCARDS,wildcardNow);showAssist("＋1 / INTRUDER",wildcardNow,"今の3語に、これだけ追加して考える")}
function shiftView(){if(!slots.every(Boolean)||busy)return;shiftNow=randomDifferent(SHIFT_VIEWS,shiftNow);showAssist("SHIFT / VIEWPOINT",shiftNow,"3語はそのまま。見る角度だけ変える")}
function revisitSeed(){const c=saved.filter(s=>(s.state||(s.used?"USED":"SEED"))!=="USED");if(!c.length){showAssist("REVISIT","再会できる未使用STOCKがありません","SEED / GROWを保存すると、ここに戻ってきます");return}const s=c[Math.floor(Math.random()*c.length)];showAssist("REVISIT",`${s.person||"—"} × ${s.word||"—"} × ${s.emotion||"—"}`,formatStockDate(s.createdAt||s.id)+" の種")}
function cycleState(id){const s=saved.find(x=>x.id===id);if(!s)return;const c=s.state||(s.used?"USED":"SEED");s.state=c==="SEED"?"GROW":c==="GROW"?"USED":"SEED";s.used=s.state==="USED";openStockId=id;persist();renderNotes()}
function setStockFilter(v){stockFilter=v;renderNotes()}

function spinStoryType(){
  const el=document.getElementById("storyTypeValue");
  if(!el)return;
  const pool=STORY_TYPES.filter(x=>x!==storyTypeNow);
  storyTypeNow=pool[Math.floor(Math.random()*pool.length)]||STORY_TYPES[0];

  let ticks=0;
  const timer=setInterval(()=>{
    const temp=STORY_TYPES[Math.floor(Math.random()*STORY_TYPES.length)];
    el.textContent=temp;
    el.style.opacity=.55;
    ticks++;
    if(ticks>=10){
      clearInterval(timer);
      el.textContent=storyTypeNow;
      el.style.opacity=1;
    }
  },55);
}

function show(name){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(name+"Screen").classList.add("active");
 if(name==="notes")renderNotes();if(name==="slot")render()
}
function escapeText(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function escapeHTML(s){return escapeText(s).replace(/\n/g,"<br>")}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
